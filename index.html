<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>📷 Mapeamento</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <h1>📷 Mapeamento</h1>

        <div class="camera-container">
            <video id="cameraView" autoplay playsinline muted></video>
            <canvas id="canvas" style="display:none;"></canvas>
            <img id="preview" alt="Foto Capturada" style="display:none;">
        </div>

        <div class="acoes">
            <button id="btnCapturar">📷 Tirar Foto</button>
            <button id="btnGaleria">🖼️ Escolher da Galeria</button>
            <button id="btnPesquisar" onclick="window.location='pesquisa.html'">🔍 Pesquisar</button>
        </div>

        <input type="file" id="galeria" accept="image/*" hidden>

        <div id="cadastro" style="display:none;">
            <hr>
            <h2 id="tituloCadastro">Dados do Cadastro</h2>

            <label>Apelido *</label>
            <input type="text" id="apelido" placeholder="Informe o apelido" required>

            <label>Nome *</label>
            <input type="text" id="nome" placeholder="Informe o nome" required>

            <label>Data de Nascimento</label>
            <input type="date" id="nascimento">

            <label>CPF</label>
            <input type="text" id="cpf" maxlength="14" placeholder="000.000.000-00">

            <label>Observações</label>
            <textarea id="obs" rows="4" placeholder="Digite observações"></textarea>

            <label>Grupo *</label>
            <select id="grupo" required>
                <option value="">Selecione...</option>
                <option value="CV">CV</option>
                <option value="PCC">PCC</option>
                <option value="Não Identificado">Não Identificado</option>
            </select>

            <div class="botoesCadastro">
                <button id="salvar">💾 Salvar Cadastro</button>
                <button id="btnPular">📸 Salvar Apenas Foto</button>
                <button id="btnCancelar">❌ Cancelar</button>
            </div>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
